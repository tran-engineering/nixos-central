name: Publish installer

# Serves nixos-central-internal/installer/install.sh at https://tran-engineering.github.io/nixos-central
# and home-only.sh at https://tran-engineering.github.io/nixos-central/home-only.sh
on:
  push:
    branches: [main]
    paths:
      - nixos-central-internal/installer/install.sh
      - nixos-central-internal/installer/home-only.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build site
        run: |
          mkdir -p site
          cp nixos-central-internal/installer/install.sh site/index.html
          cp nixos-central-internal/installer/install.sh site/install.sh
          cp nixos-central-internal/installer/home-only.sh site/home-only.sh
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
