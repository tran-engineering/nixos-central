name: Flake checks

# The equivalent of `nix flake check`, spread over several runners.
#
# `nix flake check` can't run on a hosted runner (4 CPUs, 16 GB): evaluating
# every check in one Nix process takes about 19 GB, because the evaluator never
# frees memory, and the runner dies ("lost communication with the server").
# Evaluated one at a time, no check takes more than about 6 GB.
#
# So no Nix process here evaluates more than one check or package: `shards`
# only lists the check names and evaluates each package on its own, and each
# `build` shard evaluates its checks one by one into .drv files, then builds
# those, at most two at a time, as a VM test takes up to 4 GB. The checks
# already cover every nixosConfigurations and homeConfigurations entry.
#
# Shards: the sample hosts, the NVIDIA drivers, and the remaining checks
# (mostly VM tests) round-robin. New checks are picked up without editing this
# file.
#
# Used by ci.yml and flake-update.yml.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check (default: the commit of the calling event)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  shards:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: DeterminateSystems/nix-installer-action@main

      # What `nix flake check` evaluates besides the checks. Not built: the
      # installation image is built by iso.yml.
      - name: Evaluate the packages
        run: |
          for package in $(nix eval --raw .#packages.x86_64-linux --apply 'p: toString (builtins.attrNames p)'); do
            echo "packages.x86_64-linux.$package"
            nix eval --raw ".#packages.x86_64-linux.$package.drvPath" >/dev/null
          done

      - name: Split the checks into shards
        id: shards
        env:
          TEST_SHARDS: 3
        run: |
          names=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)
          shards=$(jq -c --argjson n "$TEST_SHARDS" '
            def own: startswith("host-ci-") or startswith("nvidia-driver-");
            [ { name: "sample hosts", checks: map(select(startswith("host-ci-"))) },
              { name: "NVIDIA drivers", checks: map(select(startswith("nvidia-driver-"))) } ]
            + ( map(select(own | not)) | to_entries | group_by(.key % $n)
                | map({ name: "tests \(.[0].key % $n + 1)/\($n)", checks: map(.value) }) )
            | map(select(.checks != []) | .checks |= join(" "))
          ' <<<"$names")
          jq . <<<"$shards"
          echo "shards=$shards" >>"$GITHUB_OUTPUT"

  build:
    needs: shards
    name: build (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # Sample hosts and VM tests need more than the runner's default free space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: DeterminateSystems/nix-installer-action@main

      # One Nix process per check, so memory is freed in between. Evaluation-only
      # checks fail here.
      - name: Evaluate
        env:
          CHECKS: ${{ matrix.shard.checks }}
        run: |
          for check in $CHECKS; do
            echo "::group::checks.x86_64-linux.$check"
            nix eval --raw ".#checks.x86_64-linux.$check.drvPath" >>"$RUNNER_TEMP/drvs"
            echo >>"$RUNNER_TEMP/drvs"
            echo "::endgroup::"
          done

      # Building .drv files needs no evaluation.
      - name: Build
        run: |
          mapfile -t drvs < <(sed 's/$/^*/' "$RUNNER_TEMP/drvs")
          nix build -L --no-link --keep-going --max-jobs 2 "${drvs[@]}"
