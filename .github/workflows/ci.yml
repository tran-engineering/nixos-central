name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck installer/install.sh

  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Sample hosts and VM tests need more than the runner's default free space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: DeterminateSystems/nix-installer-action@main

      # Evaluates everything, builds the ci-* sample hosts and runs the VM tests.
      - name: nix flake check
        run: nix flake check -L
