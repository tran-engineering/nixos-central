name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck nixos-central-internal/installer/install.sh nixos-central-internal/installer/home-only.sh

  # home-only.sh end to end on a non-NixOS distribution (the runner's Ubuntu),
  # starting without Nix.
  home-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuses to run as root
        run: |
          if out=$(sudo bash nixos-central-internal/installer/home-only.sh 2>&1); then exit 1; fi
          grep -q "not as root" <<<"$out"

      - name: Install a standalone home
        env:
          NIXOS_CENTRAL_FLAKE: git+file://${{ github.workspace }}
        run: |
          echo '# pre-existing' >> ~/.bashrc
          bash nixos-central-internal/installer/home-only.sh --profile _default --install-nix --no-gpu-setup

      - name: Check the installed home
        shell: bash -l {0}
        run: |
          set -eux
          test "$EDITOR" = vim                                  # from users/_default
          command -v home-manager vim
          grep -q pre-existing ~/.bashrc.backup                 # replaced dotfile kept
          test -f ~/.config/systemd/user/home-manager-auto-upgrade.timer
          grep -q 'profile = "_default"' ~/.config/home-manager/flake.nix

  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Sample hosts and VM tests need more than the runner's default free space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: DeterminateSystems/nix-installer-action@main

      # Evaluates everything, builds the ci-* sample hosts and runs the VM tests.
      - name: nix flake check
        run: nix flake check -L
