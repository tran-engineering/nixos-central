name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck nixos-central-internal/installer/install.sh nixos-central-internal/installer/home-only.sh

  # home-only.sh end to end on a non-NixOS distribution (the runner's Ubuntu),
  # starting without Nix.
  home-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuses to run as root
        run: |
          if out=$(sudo bash nixos-central-internal/installer/home-only.sh 2>&1); then exit 1; fi
          grep -q "not as root" <<<"$out"

      - name: Install a standalone home
        env:
          NIXOS_CENTRAL_FLAKE: git+file://${{ github.workspace }}?shallow=1 # checkout is a shallow clone
        run: |
          echo '# pre-existing' >> ~/.bashrc
          bash nixos-central-internal/installer/home-only.sh --profile _default --install-nix --no-gpu-setup

      - name: Check the installed home
        shell: bash -l {0}
        run: |
          set -eux
          test "$EDITOR" = vim                                  # from users/_default
          command -v home-manager vim
          grep -q pre-existing ~/.bashrc.backup                 # replaced dotfile kept
          test -f ~/.config/systemd/user/home-manager-auto-upgrade.timer
          grep -q 'profile = "_default"' ~/.config/home-manager/flake.nix

      - name: Add and remove a private overlay
        shell: bash -l {0}
        run: |
          set -eux
          cp -r nixos-central-internal/tests/overlay /tmp/private
          git -C /tmp/private init -q
          git -C /tmp/private add .
          git -C /tmp/private -c user.name=ci -c user.email=ci@ci commit -qm overlay
          nixos-central-private setup git+file:///tmp/private --profile ci-overlay
          grep -q 'inputs.private.url = "git+file:///tmp/private";' ~/.config/home-manager/flake.nix
          grep -q 'profile = "ci-overlay";' ~/.config/home-manager/flake.nix   # overlay-only profile
          grep -q 'ci-overlay' ~/.nixos-central-overlay-profile                # that profile's file
          grep -q 'from the overlay' ~/.nixos-central-overlay-test            # overlay's file
          command -v fish                                                     # centralModules.fish
          grep -q 'nix flake update central private' "$(sed -n 's/^ExecStart=//p' ~/.config/systemd/user/home-manager-auto-upgrade.service)"
          grep -q 'github.com ssh-ed25519' ~/.ssh/known_hosts
          nixos-central-private remove
          if grep -qE 'inputs\.private|inherit private|central, private' ~/.config/home-manager/flake.nix; then exit 1; fi
          test ! -e ~/.nixos-central-overlay-test
          test ! -e ~/.nixos-central-overlay-profile

  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Sample hosts and VM tests need more than the runner's default free space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: DeterminateSystems/nix-installer-action@main

      # Evaluates everything, builds the ci-* sample hosts and runs the VM tests.
      - name: nix flake check
        run: nix flake check -L
